name: MCP Keyhunter

on:
  schedule:
    # 12h cycle: 00:00 UTC e 12:00 UTC
    - cron: "0 0 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "Override GitHub search query"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build keyhunter
        run: |
          cd scripts/mcp_keyhunter
          npm install
          npx tsc -p tsconfig.json

      - name: Run keyhunter (12h cycle)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_SEARCH_QUERY: ${{ inputs.query }}
        run: |
          node scripts/mcp_keyhunter/dist/discover.cjs

      - name: Commit + push discoveries
        run: |
          git config user.name "mcp-keyhunter[bot]"
          git config user.email "mcp-keyhunter@users.noreply.github.com"
          git add knowledge/canonical/mcp_discoveries.md knowledge/generated/mcp_registry.json README.md
          if ! git diff --staged --quiet; then
            git commit -m "auto: update MCP discoveries [12h cycle]

            Generated by mcp-keyhunter (GitHub Actions, 12h cycle).
            - New free/open-source MCPs discovered
            - Knowledge canonical + README.md auto-updated"
            git push
          else
            echo "Nenhuma mudanca detectada."
          fi

      - name: Cleanup CI artifacts + logs
        if: always()
        run: |
          rm -rf node_modules scripts/mcp_keyhunter/node_modules
          rm -rf scripts/mcp_keyhunter/dist
          rm -f scripts/mcp_keyhunter/*.log logs/*.log
          echo "=== Cleanup complete: node_modules + dist + logs removidos ==="
